[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-devops-incident-analyzer"
version = "0.1.0"
description = "Deterministic log analysis and evidence-based incident reports, with an optional AI explanation layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["devops", "sre", "observability", "incident", "logs", "prometheus"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Logging",
    "Topic :: System :: Systems Administration",
]
# The core tool has ZERO runtime dependencies on purpose.
dependencies = []

[project.optional-dependencies]
# Optional: read logs from AWS CloudWatch Logs.
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
incident-analyzer = "incident_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/build_pdf.py" = ["E501"]  # long CSS strings

[tool.coverage.run]
source = ["incident_analyzer"]
branch = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true
