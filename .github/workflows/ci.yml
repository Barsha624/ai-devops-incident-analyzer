name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: mypy
        run: mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # [aws] so the botocore-based tests run for real instead of being skipped
      - run: pip install -e ".[dev,aws]"
      - name: pytest with coverage
        run: pytest --cov=incident_analyzer --cov-branch --cov-report=term-missing
      - name: Samples still produce the expected incidents (regression check)
        run: python -m incident_analyzer evaluate evaluation/synthetic-labels.json

  package:
    name: Build wheel and smoke-test the install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/incident-analyzer --version
          /tmp/venv/bin/incident-analyzer analyze samples --no-color

  docker:
    name: Docker build verification
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ai-devops-incident-analyzer:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container runs as a non-root user
        run: test "$(docker run --rm --entrypoint id ai-devops-incident-analyzer:ci -u)" != "0"
      - name: Container analyses the bundled samples
        run: docker run --rm ai-devops-incident-analyzer:ci analyze /opt/samples --no-color
      - name: --fail-on works as a CI gate (expects exit code 1 for the sample outage)
        run: |
          set +e
          docker run --rm ai-devops-incident-analyzer:ci analyze /opt/samples --format json --fail-on critical > /dev/null
          test "$?" -eq 1
